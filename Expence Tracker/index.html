<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <h1>Ledger</h1>
      <div class="sub">a plain-spoken record of what comes in and what goes out</div>
    </div>
    <div class="date" id="todayDate"></div>
  </div>
</header>

<div class="wrap">

  <section class="summary">
    <div class="card income">
      <div class="label">total income</div>
      <div class="amount" id="totalIncome">$0.00</div>
    </div>
    <div class="card expense">
      <div class="label">total expenses</div>
      <div class="amount" id="totalExpense">$0.00</div>
    </div>
    <div class="card balance">
      <div class="label">current balance</div>
      <div class="amount" id="totalBalance">$0.00</div>
    </div>
  </section>

  <section class="entry">
    <h2 id="formTitle">Add a transaction</h2>
    <form id="txnForm">
      <div class="field" style="grid-column: 1;">
        <label>description</label>
        <input type="text" id="descInput" placeholder="e.g. groceries" required>
      </div>
      <div class="field">
        <label>amount</label>
        <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0.01" required>
      </div>
      <div class="field">
        <label>category</label>
        <select id="categoryInput"></select>
      </div>
      <div class="field">
        <label>date</label>
        <input type="date" id="dateInput" required>
      </div>
      <div class="field" style="grid-column: 1;">
        <label>type</label>
        <div class="type-toggle">
          <button type="button" id="btnIncome" class="income">Income</button>
          <button type="button" id="btnExpense" class="expense active">Expense</button>
        </div>
      </div>
      <button type="submit" class="add-btn" id="submitBtn">Add entry</button>
    </form>
  </section>

  <div class="ledger-head">
    <h2>Transactions</h2>
    <div class="filters" id="filterRow"></div>
  </div>

  <div class="ledger" id="ledgerList"></div>

</div>

<script src="script.js"></script>
</body>
</html>
